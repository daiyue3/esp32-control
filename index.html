<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <p class="status" id="status">正在连接服务器...</p>

        <h3>烟雾数值</h3>
        <div class="value" id="smokeValue">--</div>

        <h3>温度 / 湿度</h3>
        <div class="value" id="tempHumidity">-- / --</div>

        <h3>输入报警阈值 (例如: 2000)</h3>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // 配置信息
        const options = {
            host: 'bemfa.com',
            port: 9504,
            path: '/wss',
            clientId: 'esp32_smoke_monitor_' + Math.random().toString(16).substr(2, 8),
            userName: 'c242d5db2b79258b3cb0533f8a736018', // 你的密钥
            password: '', // 密码留空
            useSSL: true,
            timeout: 3
        };

        // 创建 MQTT 客户端
        const client = new Paho.MQTT.Client(options.host, options.port, options.path);

        // 连接选项
        const connOpts = {
            onSuccess: onConnect,
            onFailure: function (e) {
                console.log('连接失败:', e);
                document.getElementById('status').innerText = '连接失败: ' + e.errorMessage;
            },
            userName: options.userName,
            password: options.password,
            useSSL: options.useSSL,
            timeout: options.timeout
        };

        // 连接成功
        function onConnect() {
            console.log('连接成功');
            document.getElementById('status').innerText = '已连接到服务器';
            // 订阅主题
            client.subscribe('smokeTopic');
        }

        // 收到消息
        client.onMessageArrived = function (message) {
            console.log('收到消息:', message.payloadString);
            const data = JSON.parse(message.payloadString);
            document.getElementById('smokeValue').innerText = data.smokeValue;
            document.getElementById('tempHumidity').innerText = data.temperature + ' / ' + data.humidity;
        };

        // 发送阈值
        function sendThreshold() {
            const threshold = document.getElementById('thresholdInput').value;
            if (threshold) {
                const message = new Paho.MQTT.Message(threshold);
                message.destinationName = 'smokeTopic';
                client.send(message);
                console.log('发送阈值:', threshold);
            }
        }

        // 连接
        client.connect(connOpts);
    </script>
</body>
</html>
