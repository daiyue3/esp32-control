<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div class="status" id="status">正在连接服务器...</div>

        <div>烟雾数值</div>
        <div class="value" id="smokeValue">--</div>

        <div>温度 / 湿度</div>
        <div class="value" id="tempHumiValue">-- / --</div>

        <input type="number" id="thresholdInput" placeholder="输入报警阈值 (例如: 2000)">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // ================= 配置区域 =================
        const UID = "请填入你的巴法云UID"; // 必填：你的巴法云UID
        const TOPIC_SMOK = "请填入你的烟雾主题"; // 必填：订阅的主题（如 myesp32smok）
        const TOPIC_SET = "请填入你的设置主题"; // 必填：发送的主题（如 myesp32set）
        // ===========================================

        // 检查配置是否填写
        if (UID === "请填入你的巴法云UID") {
            alert("请先在代码中填写你的巴法云UID和主题！");
        }

        // 连接参数（严格按照官方文档）
        const client = new Paho.MQTT.Client("bemfa.com", 9504, "web_client_" + Math.random());

        const connectOptions = {
            onSuccess: onConnect,
            onFailure: function (e) {
                console.error("连接失败:", e);
                document.getElementById('status').innerText = "连接失败: " + e.errorMessage;
            },
            useSSL: true,
            timeout: 3,
            // 关键修复：即使不需要密码，也要给一个空字符串，防止浏览器报错
            userName: UID,
            password: ""
        };

        client.onConnectionLost = function (responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("连接断开: " + responseObject.errorMessage);
                document.getElementById('status').innerText = "连接断开，正在重连...";
                // 尝试自动重连
                setTimeout(() => { client.connect(connectOptions); }, 3000);
            }
        };

        client.onMessageArrived = function (message) {
            const topic = message.destinationName;
            const payload = message.payloadString;
            console.log("收到消息: " + payload + " 来自主题: " + topic);

            if (topic === TOPIC_SMOK) {
                // 假设消息格式为 "烟雾值,温度,湿度" 例如 "1200,25,60"
                const parts = payload.split(',');
                if (parts.length === 3) {
                    document.getElementById('smokeValue').innerText = parts[0];
                    document.getElementById('tempHumiValue').innerText = parts[1] + " / " + parts[2];
                } else {
                    // 如果格式不对，直接显示原始数据
                    document.getElementById('smokeValue').innerText = payload;
                }
            }
        };

        function onConnect() {
            console.log("已连接到服务器");
            document.getElementById('status').innerText = "已连接";
            client.subscribe(TOPIC_SMOK);
        }

        // 发起连接
        client.connect(connectOptions);

        function sendThreshold() {
            const val = document.getElementById('thresholdInput').value;
            if (!val) {
                alert("请输入阈值");
                return;
            }
            const message = new Paho.MQTT.Message(val);
            message.destinationName = TOPIC_SET;
            client.send(message);
            alert("阈值 " + val + " 已发送");
        }
    </script>
</body>
</html>
