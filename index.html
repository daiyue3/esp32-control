<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div class="status" id="status">正在连接服务器...</div>

        <h3>烟雾数值</h3>
        <div class="value" id="smokeValue">--</div>

        <h3>温度 / 湿度</h3>
        <div class="value" id="tempHumidity">-- / --</div>

        <h3>输入报警阈值 (例如: 2000)</h3>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // 配置信息
        const uid = "c242d5db2b79258b3cb0533f8a736018";
        const topic = "smokeTopic";
        const host = "bemfa.com";
        const port = 9504;
        const path = "/wss"; // 关键修复：路径必须是 /wss

        // 创建客户端
        const client = new Paho.MQTT.Client(host, port, path, "web_" + Math.random());

        // 连接选项
        const options = {
            timeout: 3,
            userName: uid, // 密钥作为用户名
            password: "",  // 密码留空
            useSSL: true,  // 强制使用 SSL
            onSuccess: onConnect,
            onFailure: function (e) {
                document.getElementById("status").innerHTML = "连接失败: " + e.errorMessage;
                console.error("连接失败:", e);
            }
        };

        // 连接成功
        function onConnect() {
            document.getElementById("status").innerHTML = "已连接到服务器";
            client.subscribe(topic);
            console.log("已订阅主题:", topic);
        }

        // 接收消息
        client.onMessageArrived = function (message) {
            const payload = message.payloadString;
            console.log("收到消息:", payload);

            // 解析数据格式：假设格式为 "smoke:123,temp:25,humi:60"
            const data = {};
            payload.split(',').forEach(item => {
                const [key, value] = item.split(':');
                data[key.trim()] = value.trim();
            });

            // 更新页面
            if (data.smoke) {
                document.getElementById("smokeValue").innerHTML = data.smoke;
            }
            if (data.temp && data.humi) {
                document.getElementById("tempHumidity").innerHTML = data.temp + " / " + data.humi;
            }
        };

        // 发送阈值
        function sendThreshold() {
            const threshold = document.getElementById("thresholdInput").value;
            if (threshold) {
                const message = new Paho.MQTT.Message(threshold);
                message.destinationName = topic;
                client.send(message);
                console.log("发送阈值:", threshold);
            }
        }

        // 连接服务器
        client.connect(options);
    </script>
</body>
</html>
