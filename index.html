<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <!-- 使用 Paho MQTT 库，这个库在浏览器上最稳定 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div id="status" class="status">正在连接服务器...</div>

        <h3>烟雾数值</h3>
        <div id="smokeValue" class="value">--</div>

        <h3>温度 / 湿度</h3>
        <div id="tempValue" class="value">-- / --</div>

        <hr>
        <input type="number" id="thresholdInput" placeholder="输入报警阈值 (例如: 2000)">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // ================= 配置区域 =================
        // 这里的设置必须和 ESP32 代码里的保持一致
        const mqttBroker = "bemfa.com";
        const mqttPort = 443;             // 关键：必须使用 443 端口穿透防火墙
        const mqttPath = "/ws";           // 关键：443 端口对应的路径必须是 /ws
        const clientId = "web_" + Math.random().toString(16).substr(2, 8); // 随机客户端ID
        const topic = "smokeTopic";       // 订阅的主题
        const uid = "c242d5db2b79258b3cb0533f8a736018"; // 你的巴法云私钥
        // ===========================================

        let client;

        function connect() {
            console.log("尝试连接到:", mqttBroker, "端口:", mqttPort);

            // 创建客户端实例
            client = new Paho.MQTT.Client(mqttBroker, mqttPort, mqttPath, clientId);

            // 设置回调函数
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            // 连接选项
            const options = {
                useSSL: true,           // 关键：必须开启 SSL
                userName: uid,          // 巴法云用户名填私钥
                onSuccess: onConnect,
                onFailure: function(e) {
                    console.error("连接失败:", e);
                    document.getElementById("status").innerText = "连接失败，请检查控制台";
                }
            };

            console.log("正在发起连接...");
            client.connect(options);
        }

        function onConnect() {
            console.log("连接成功！正在订阅主题...");
            document.getElementById("status").innerText = "已连接，等待数据...";
            client.subscribe(topic);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("连接断开: " + responseObject.errorMessage);
                document.getElementById("status").innerText = "连接已断开，正在重试...";
                // 5秒后自动重连
                setTimeout(connect, 5000);
            }
        }

        function onMessageArrived(message) {
            console.log("收到消息:", message.payloadString);
            const payload = message.payloadString;

            try {
                // 尝试解析 JSON 数据
                const data = JSON.parse(payload);

                if (data.smoke !== undefined) {
                    document.getElementById("smokeValue").innerText = data.smoke;
                }
                if (data.temperature !== undefined) {
                    document.getElementById("tempValue").innerText = data.temperature + " / " + data.humidity;
                }

            } catch (e) {
                console.error("JSON解析失败:", e);
            }
        }

        function sendThreshold() {
            const val = document.getElementById("thresholdInput").value;
            if (!val) return;

            // 发送消息到同一个主题（ESP32 需要订阅这个主题才能收到）
            const message = new Paho.MQTT.Message("SET_THRESHOLD:" + val);
            message.destinationName = topic;
            client.send(message);
            alert("阈值 " + val + " 已发送");
        }

        // 页面加载完成后立即连接
        window.onload = connect;
    </script>
</body>
</html>
