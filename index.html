<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控 (已修复)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }
        .value { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #333; 
            margin: 1rem 0; 
        }
        .status { 
            color: #888; 
            font-size: 0.9rem; 
            margin-bottom: 1rem; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div id="status" class="status">正在连接...</div>

        <div>烟雾数值</div>
        <div id="smoke" class="value">--</div>

        <div>温度 / 湿度</div>
        <div id="temp-humi" class="value">-- / --</div>

        <div style="margin-top: 1rem; text-align: left; font-size: 0.9rem; font-weight: bold;">
            输入报警阈值 (例如: 2000)
        </div>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // --- 配置区域 ---
        const uid = "c242d5db2b79258b3cb0533f8a736018";
        const topic = "smokeTopic";
        const clientId = "web_" + Math.random().toString(16).substr(2, 8);

        // --- MQTT 连接逻辑 ---
        const client = new Paho.MQTT.Client("bemfa.com", 9504, "/wss", clientId);

        client.onConnectionLost = function (responseObject) {
            document.getElementById('status').innerText = "连接断开: " + responseObject.errorMessage;
        };

        client.onMessageArrived = function (message) {
            // --- 核心修复：确保解析 JSON ---
            let data;
            try {
                // 1. 获取 Payload (处理可能的 Object 或 String 情况)
                let payload = message.payloadString || message.payloadBytes || message;

                // 2. 如果是 Buffer/ArrayBuffer (字节流)，转换为字符串
                if (payload instanceof ArrayBuffer || (payload.buffer && payload.buffer instanceof ArrayBuffer)) {
                    const bytes = new Uint8Array(payload.buffer || payload);
                    let text = '';
                    for (let i = 0; i < bytes.length; i++) {
                        text += String.fromCharCode(bytes[i]);
                    }
                    payload = text;
                }

                // 3. 如果是字符串，解析 JSON
                if (typeof payload === 'string') {
                    // 去除可能的不可见字符
                    payload = payload.trim();
                    data = JSON.parse(payload);
                    console.log('✅ 解析成功:', data);
                } 
                // 如果已经是一个对象 (某些库版本会自动解析)，直接使用
                else if (typeof payload === 'object') {
                    data = payload;
                    console.log('ℹ️ 已是对象:', data);
                }

                // --- 更新 DOM ---
                if (data && data.smoke !== undefined) {
                    document.getElementById('smoke').innerText = data.smoke;
                }
                if (data && data.temp !== undefined && data.humi !== undefined) {
                    document.getElementById('temp-humi').innerText = 
                        `${data.temp}°C / ${parseFloat(data.humi).toFixed(1)}%`;
                }

            } catch (e) {
                console.error('❌ 数据解析失败:', e);
                console.log('收到的原始数据:', message);
                document.getElementById('smoke').innerText = 'Err';
            }
        };

        // 连接选项
        const options = {
            useSSL: true, // 巴法云推荐使用 SSL
            userName: uid,
            password: "",
            onSuccess: function () {
                console.log("🚀 连接成功");
                document.getElementById('status').innerText = "已连接";
                client.subscribe(topic);
            },
            onFailure: function (error) {
                console.error(" 连接失败:", error);
                document.getElementById('status').innerText = "连接失败";
            }
        };

        // 发起连接
        client.connect(options);

        // --- 发送功能 ---
        function sendThreshold() {
            const val = document.getElementById('thresholdInput').value;
            if (val && client.isConnected()) {
                const message = new Paho.MQTT.Message(val);
                message.destinationName = topic;
                client.send(message);
                console.log("📤 已发送阈值:", val);
            } else {
                alert("请先输入数值并确保连接成功！");
            }
        }
    </script>
</body>
</html>
