<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <!-- 引入 Paho MQTT 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div class="status" id="statusText">正在连接服务器...</div>

        <div>烟雾数值</div>
        <div class="value" id="smokeValue">--</div>

        <div>输入报警阈值 (例如: 2000)</div>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // --- 配置区域 (已填入你提供的信息) ---
        const uid = "c242d5db2b79258b3cb0533f8a736018"; 
        const topicStr = "smokeTopic";          
        const clientID = "web_" + Math.random().toString(16).substr(2, 8); 

        // --- 连接配置 ---
        // 使用官方文档的加密 WebSocket 端口 9504 和路径 /wss
        const client = new Paho.MQTT.Client("bemfa.com", 9504, clientID);

        // 设置连接选项
        const options = {
            timeout: 3,
            useSSL: false, // 物理连接已由 wss 处理，此处设为 false 避免冲突
            cleanSession: true,
            // 关键修复：巴法云连接需要携带 UID，密码设为空字符串防止浏览器报错
            userName: uid,
            password: "" 
        };

        // 设置回调函数
        client.onConnectionLost = function (responseObject) {
            document.getElementById("statusText").innerHTML = "连接丢失: " + responseObject.errorMessage;
            console.log("连接丢失", responseObject);
        };

        client.onMessageArrived = function (message) {
            console.log("收到消息:", message.payloadString);
            const payload = message.payloadString;
            
            // 简单解析逻辑：如果包含逗号，认为是 "烟雾值,温度值" 格式
            if (payload.includes(",")) {
                const parts = payload.split(",");
                document.getElementById("smokeValue").innerText = parts[0]; // 显示烟雾值
                // 如果后面有温度数据，可以在这里添加显示逻辑
            } else {
                // 否则直接显示
                document.getElementById("smokeValue").innerText = payload;
            }
        };

        // 发起连接
        try {
            client.connect(options);
            client.subscribe(topicStr);
            document.getElementById("statusText").innerHTML = "已连接";
        } catch (error) {
            console.error("连接失败:", error);
            document.getElementById("statusText").innerHTML = "连接失败，请检查控制台";
        }

        // 发送阈值函数
        function sendThreshold() {
            const val = document.getElementById("thresholdInput").value;
            if (!val) {
                alert("请输入数值");
                return;
            }
            const message = new Paho.MQTT.Message(val);
            message.destinationName = topicStr;
            client.send(message);
            alert("已发送阈值: " + val);
        }
    </script>
</body>
</html>
