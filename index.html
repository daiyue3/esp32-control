<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div class="status" id="statusText">连接中...</div>

        <h3>烟雾数值</h3>
        <div class="value" id="smokeValue">--</div>

        <h3>温度 / 湿度</h3>
        <div class="value" id="tempHumValue">-- / --</div>

        <h3>输入报警阈值 (例如: 2000)</h3>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // ================= 配置区域 =================
        const mqttConfig = {
            host: 'bemfa.com',
            port: 9502, // WebSocket SSL 端口
            topic: 'smoke002', // 你的主题
            secretKey: '66a15648c18b448498193333981a5568' // 你的私钥
        };
        // ============================================

        let client;

        function connect() {
            // 关键点：根据文档，私钥必须放在 clientId 中
            client = new Paho.MQTT.Client(
                mqttConfig.host,
                mqttConfig.port,
                mqttConfig.secretKey // 这里！私钥作为 Client ID
            );

            client.onConnectionLost = (responseObject) => {
                console.error("连接丢失:", responseObject);
                document.getElementById('statusText').innerText = "连接丢失，正在重试...";
                setTimeout(connect, 3000); // 3秒后重连
            };

            client.onMessageArrived = (message) => {
                const payload = message.payloadString;
                console.log("收到消息:", payload);
                parseData(payload);
            };

            // 连接选项：用户名和密码留空（根据文档方式一）
            const options = {
                useSSL: true,
                timeout: 10,
                onSuccess: () => {
                    console.log("连接成功");
                    document.getElementById('statusText').innerText = "已连接到云端";
                    client.subscribe(mqttConfig.topic);
                },
                onFailure: (error) => {
                    console.error("连接失败:", error);
                    document.getElementById('statusText').innerText = "连接失败: " + error.errorMessage;
                }
            };

            client.connect(options);
        }

        function parseData(data) {
            // 尝试解析 JSON 数据
            try {
                const obj = JSON.parse(data);
                if (obj.smoke !== undefined) {
                    document.getElementById('smokeValue').innerText = obj.smoke;
                }
                if (obj.temperature !== undefined && obj.humidity !== undefined) {
                    document.getElementById('tempHumValue').innerText = `${obj.temperature} / ${obj.humidity}`;
                }
            } catch (e) {
                console.warn("非 JSON 数据:", data);
            }
        }

        function sendThreshold() {
            const val = document.getElementById('thresholdInput').value;
            if (!val) return alert("请输入数值");

            // 向主题发送消息，ESP32 订阅该主题即可接收
            const message = new Paho.MQTT.Message(val);
            message.destinationName = mqttConfig.topic;
            client.send(message);
            alert(`阈值 ${val} 已发送`);
        }

        // 初始化连接
        connect();
    </script>
</body>
</html>
