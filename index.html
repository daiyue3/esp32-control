<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <!-- 使用 Paho MQTT 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div id="status" class="status">正在连接服务器...</div>

        <div>烟雾数值</div>
        <div id="smokeValue" class="value">--</div>

        <div>温度 / 湿度</div>
        <div id="thValue" class="value">-- / --</div>

        <input type="number" id="thresholdInput" placeholder="输入报警阈值 (例如: 2000)">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // ================= 配置区域 =================
        const UID = "c242d5db2b79258b3cb0533f8a736018"; // 请填入你的巴法云UID
        const TOPIC = "smokeTopic";     // 请填入你的主题
        const CLIENT_ID = "web_" + Math.random().toString(16).substr(2, 8); // 随机客户端ID

        // ================= 核心连接逻辑 =================
        // 根据你提供的文档截图，这里使用了官方指定的 9504 端口和 /wss 路径
        const HOST = "bemfa.com";
        const PORT = 9504;
        const PATH = "/wss";

        // 创建客户端实例
        const client = new Paho.MQTT.Client(HOST, PORT, PATH, CLIENT_ID);

        // 设置回调处理函数
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        // 连接选项
        const options = {
            useSSL: true, // 必须开启 SSL
            userName: UID, // 巴法云要求用户名是UID
            onSuccess: onConnect,
            onFailure: function(e) {
                console.error("连接失败:", e);
                document.getElementById("status").innerHTML = "连接失败: " + e.errorMessage;
            }
        };

        // 发起连接
        console.log("正在连接到 wss://" + HOST + ":" + PORT + PATH);
        client.connect(options);

        function onConnect() {
            console.log("已连接到巴法云");
            document.getElementById("status").innerHTML = "● 已连接";
            document.getElementById("status").style.color = "green";

            // 订阅主题
            client.subscribe(TOPIC);
            console.log("已订阅主题: " + TOPIC);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("连接断开: " + responseObject.errorMessage);
                document.getElementById("status").innerHTML = "连接断开，正在重试...";
                document.getElementById("status").style.color = "red";

                // 尝试重连
                setTimeout(() => {
                    client.connect(options);
                }, 3000);
            }
        }

        function onMessageArrived(message) {
            console.log("收到消息: " + message.payloadString);
            const payload = message.payloadString;

            // 更新烟雾数值
            document.getElementById("smokeValue").innerHTML = payload;
        }

        function sendThreshold() {
            const val = document.getElementById("thresholdInput").value;
            if (!val) {
                alert("请输入数值");
                return;
            }

            // 向主题发送消息（假设ESP32订阅了同一个主题或者有特定的下发主题）
            // 注意：巴法云下发通常需要特定的主题格式，这里假设直接发到 myesp32
            const message = new Paho.MQTT.Message(val);
            message.destinationName = TOPIC;
            client.send(message);
            alert("阈值 " + val + " 已发送");
        }
    </script>
</body>
</html>
