<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控 (带蜂鸣器)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div class="status" id="statusText">正在连接...</div>

        <h3>烟雾数值</h3>
        <div class="value" id="smokeValue">--</div>

        <h3>温度 / 湿度</h3>
        <div class="value" id="tempHumValue">-- / --</div>

        <h3>输入报警阈值 (当前: <span id="thresholdSpan">--</span>)</h3>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        var result;
        const config = {
            uid: "c242d5db2b79258b3cb0533f8a736018",
            topic: "smokeTopic",
            host: "bemfa.com",
            port: 9504,
            path: "/wss"
        };

        let client;

        function connect() {
            client = new Paho.MQTT.Client(config.host, config.port, config.path, config.uid);
            const options = {
                keepAliveInterval: 60,
                cleanSession: true,
                useSSL: true,
                onSuccess: onConnect,
                onFailure: function (error) {
                    console.error("连接失败:", error);
                    document.getElementById('statusText').innerText = "连接失败: " + error.errorMessage;
                }
            };
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;
            client.connect(options);
        }

        function onConnect() {
            console.log("连接服务器成功");
            document.getElementById('statusText').innerText = "已连接";
            client.subscribe(config.topic);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("连接丢失:", responseObject.errorMessage);
                document.getElementById('statusText').innerText = "连接丢失，正在重试...";
                setTimeout(connect, 3000);
            }
        }

        function onMessageArrived(message) {
            const payload = message.payloadString;
            result = JSON.parse(payload)
            console.log("收到消息:", result);
            
            if (typeof result == 'object' && result != null) {
                document.getElementById('smokeValue').innerText = result.smoke || "--";
                document.getElementById('thresholdSpan').innerText = result.threshold || "--";
                document.getElementById('tempHumValue').innerText = result.temp.toFixed(1) + "℃" + " / " + result.humi.toFixed(1) + "%";
            } else {
                document.getElementById('thresholdSpan').innerText = result
            }
        }

        // 【修改点1】在发送按钮里，顺便激活一下音频权限
        function sendThreshold() {
            const val = document.getElementById('thresholdInput').value;
            if (!val) return;

            // 尝试播放并立即暂停，目的是获取浏览器的音频播放授权
            if (window.alertAudio) {
                window.alertAudio.play().then(() => {
                    window.alertAudio.pause();
                    window.alertAudio.currentTime = 0;
                }).catch(() => {});
            }

            if (client && client.isConnected()) {
                const message = new Paho.MQTT.Message(val);
                message.destinationName = config.topic;
                client.send(message);
                console.log("发送阈值:", val);
            } else {
                alert("未连接到服务器");
            }
        }

        window.onload = connect;
    </script>

    <!-- 新增的蜂鸣器报警代码 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 【修改点2】替换为真实有效的蜂鸣声 Base64
            window.alertAudio = new Audio('data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAPAAADTGF2ZjU3LjU2LjEwMAAAAAAAAAAAAAAA//uQZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWgAAAA0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==');
            window.alertAudio.preload = 'auto';

            const smokeEl = document.getElementById('smokeValue');
            const inputEl = document.getElementById('thresholdInput');
            let isAlerting = false;

            const observer = new MutationObserver(() => {
                let currentSmoke = parseInt(smokeEl.innerText) || 0;
                let threshold = parseInt(inputEl.value) || 0;

                if (currentSmoke > 0 && threshold > 0 && currentSmoke > threshold) {
                    if (!isAlerting) {
                        isAlerting = true;
                        // 播放蜂鸣声
                        window.alertAudio.cloneNode(true).play().catch(e => {
                            console.log('⚠️ 播放被浏览器拦截，请先点击页面上的按钮！');
                        });
                        console.log('🚨 蜂鸣器报警：烟雾超标！', currentSmoke, '>', threshold);
                    }
                } else {
                    isAlerting = false;
                }
            });

            if (smokeEl) {
                observer.observe(smokeEl, { childList: true, subtree: true, characterData: true });
            }
        });
    </script>
</body>
</html>
