<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <p id="status" class="status">正在连接服务器...</p>

        <h3>烟雾数值</h3>
        <div id="smokeValue" class="value">--</div>

        <h3>输入报警阈值 (例如: 2000)</h3>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // 配置信息
        const uid = "c242d5db2b79258b3cb0533f8a736018"; // 你的私钥
        const topic = "smokeTopic";                    // 你的主题
        const host = "bemfa.com";
        const port = 9504;

        // 创建 MQTT 客户端 (注意路径是 /wss)
        const client = new Paho.MQTT.Client(host, port, "/wss", "web_" + Math.random());

        // 连接选项
        const options = {
            useSSL: true,
            userName: uid,
            password: "", // 必须设为空字符串，不能是 undefined
            onSuccess: onConnect,
            onFailure: function(e) {
                console.error("连接失败:", e);
                document.getElementById("status").innerText = "连接失败: " + e.errorMessage;
            }
        };

        // 发起连接
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;
        client.connect(options);

        function onConnect() {
            console.log("已连接到巴法云");
            document.getElementById("status").innerText = "已连接";
            client.subscribe(topic);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("连接断开: " + responseObject.errorMessage);
                document.getElementById("status").innerText = "连接断开: " + responseObject.errorMessage;
            }
        }

        function onMessageArrived(message) {
            const payload = message.payloadString;
            console.log("收到消息: " + payload);
            document.getElementById("smokeValue").innerText = payload;
        }

        function sendThreshold() {
            const val = document.getElementById("thresholdInput").value;
            if (!val) return;

            const message = new Paho.MQTT.Message(val);
            message.destinationName = topic;
            client.send(message);
            alert("阈值已发送: " + val);
        }
    </script>
</body>
</html>
