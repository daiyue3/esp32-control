<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <!-- 引入 Paho MQTT 库（CDN加速版） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .alarm { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="card">
    <h2>ESP32 烟雾监控</h2>
    <div id="status" class="status">连接中...</div>
    
    <div>烟雾数值</div>
    <div id="smokeVal" class="value">--</div>
    
    <div>温度 / 湿度</div>
    <div id="tempHumi" class="value" style="font-size: 1.5rem;">-- / --</div>

    <hr style="width: 100%; border: 0.5px solid #eee; margin: 20px 0;">

    <input type="number" id="thresholdInput" placeholder="输入报警阈值 (例如: 2000)">
    <button onclick="sendThreshold()">发送阈值到 ESP32</button>
</div>

<script>
    // ================= 配置区域 =================
    // 注意：这里必须填你巴法云后台的私钥
    const privateKey = "c242d5db2b79258b3cb0533f8a736018"; 
    const topic = "smokeTopic"; 
    
    // ================= 连接逻辑 =================
    // 使用 443 端口 + /ws 路径，这是网页端最稳的连接方式
    const client = new Paho.MQTT.Client("bemfa.com", 443, "/ws", "web_" + Math.random().toString(16).substr(2, 8));

    client.onConnectionLost = function (responseObject) {
        console.log("连接丢失: " + responseObject.errorMessage);
        document.getElementById("status").innerText = "连接断开，正在重连...";
        document.getElementById("status").style.color = "red";
    };

    client.onMessageArrived = function (message) {
        console.log("收到消息: " + message.payloadString);
        
        try {
            // 解析 JSON 数据
            const data = JSON.parse(message.payloadString);
            
            // 更新界面
            document.getElementById("smokeVal").innerText = data.smoke;
            document.getElementById("tempHumi").innerText = data.temp + "°C / " + data.humi + "%";
            
            // 报警状态显示
            if(data.alarm === "ON") {
                document.getElementById("smokeVal").classList.add("alarm");
            } else {
                document.getElementById("smokeVal").classList.remove("alarm");
            }

        } catch (e) {
            console.error("解析JSON失败", e);
        }
    };

    // 连接选项
    const options = {
        useSSL: true, // 开启 SSL 加密
        userName: privateKey, // 巴法云用户名为私钥
        password: "", 
        onSuccess: function () {
            console.log("已连接到巴法云");
            document.getElementById("status").innerText = "在线 (Connected)";
            document.getElementById("status").style.color = "green";
            client.subscribe(topic); // 连接成功后订阅主题
        },
        onFailure: function (message) {
            console.log("连接失败: " + message.errorMessage);
            document.getElementById("status").innerText = "连接失败，检查控制台";
        }
    };

    // 发起连接
    client.connect(options);

    // ================= 发送函数 =================
    function sendThreshold() {
        const val = document.getElementById("thresholdInput").value;
        if (!val) {
            alert("请输入数值");
            return;
        }

        // 发送格式：直接发送数字字符串，ESP32代码里做了兼容处理
        const message = new Paho.MQTT.Message(val);
        message.destinationName = topic;
        client.send(message);
        
        alert("阈值 " + val + " 已发送！");
    }
</script>

</body>
</html>
