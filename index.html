<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 烟雾监控</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #333; margin: 1rem 0; }
        .status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 烟雾监控</h2>
        <div id="status" class="status">正在连接...</div>

        <div>烟雾数值</div>
        <div id="smokeValue" class="value">--</div>

        <div>输入报警阈值 (例如: 2000)</div>
        <input type="number" id="thresholdInput" placeholder="输入数值">
        <button onclick="sendThreshold()">发送阈值到 ESP32</button>
    </div>

    <script>
        // ================= 配置区 =================
        const UID = "c242d5db2b79258b3cb0533f8a736018";
        const TOPIC = "smokeTopic";
        // =========================================

        // 核心修复：使用 wss:// (加密) 和 /ws 路径
        const client = new Paho.MQTT.Client("bemfa.com", 9504, "web_" + Math.random().toString(16).substr(2, 8));

        client.onConnectionLost = (responseObject) => {
            document.getElementById('status').innerText = "连接断开: " + responseObject.errorMessage;
            console.log("连接断开", responseObject);
        };

        client.onMessageArrived = (message) => {
            console.log("收到消息:", message.payloadString);
            document.getElementById('smokeValue').innerText = message.payloadString;
        };

        // 连接选项
        const options = {
            timeout: 3,
            // 巴法云必须传用户名(UID)，密码为空字符串
            userName: UID,
            password: "",
            useSSL: true, // 强制开启SSL
            onSuccess: () => {
                document.getElementById('status').innerText = "已连接";
                client.subscribe(TOPIC);
            },
            onFailure: (e) => {
                document.getElementById('status').innerText = "连接失败: " + e.errorMessage;
                console.error("连接失败", e);
            }
        };

        // 发起连接
        client.connect(options);

        function sendThreshold() {
            const val = document.getElementById('thresholdInput').value;
            if (!val) return alert("请输入数值");

            // 巴法云发布消息格式：topic#msg
            const payload = `${TOPIC}#${val}`;
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = TOPIC;
            client.send(message);
            alert("已发送: " + val);
        }
    </script>
</body>
</html>
