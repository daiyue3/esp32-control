<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 远程控制台</title>
    <!-- 引入 MQTT 库 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .data-box { background: #eef2f5; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .data-value { font-size: 36px; font-weight: bold; color: #007bff; }
        .data-label { color: #666; font-size: 14px; }
        .control-box { display: flex; flex-direction: column; gap: 15px; }
        input[type="number"] { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 ESP32 远程监控</h2>

    <!-- 实时数据显示区 -->
    <div class="data-box">
        <div class="data-label">当前传感器数值</div>
        <div class="data-value" id="sensorValue">--</div>
    </div>

    <!-- 控制区 -->
    <div class="control-box">
        <label for="threshold" style="color:#666; font-size:14px;">设置报警阈值：</label>
        <input type="number" id="threshold" placeholder="输入阈值 (例如: 50)">
        <button onclick="sendThreshold()">🚀 发送阈值到 ESP32</button>
    </div>

    <div id="status">正在连接服务器...</div>
</div>

<script>
    // ================= 配置区 =================
    const MY_PRIVATE_KEY = 'c242d5db2b79258b3cb0533f8a736018'; // 你的巴法云私钥
    const MQTT_TOPIC = 'smokeTopic';            // 你的通信主题
    // =========================================

    // 连接选项
    const options = {
        connectTimeout: 4000,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        username: MY_PRIVATE_KEY,
        password: MY_PRIVATE_KEY,
        keepalive: 60
    };

    // 建立 WebSocket 连接 (巴法云默认端口 8084)
    const client = mqtt.connect('ws://bemfa.com:8084/mqtt', options);

    const statusDiv = document.getElementById('status');
    const sensorValueDiv = document.getElementById('sensorValue');

    // 连接成功
    client.on('connect', function () {
        statusDiv.innerHTML = '✅ 已连接到云端，正在监听数据...';
        statusDiv.style.color = 'green';
        // 订阅主题，接收 ESP32 发来的消息
        client.subscribe(MQTT_TOPIC, function (err) {
            if (err) console.log('订阅失败', err);
        });
    });

    // 连接断开
    client.on('close', function () {
        statusDiv.innerHTML = '❌ 连接已断开';
        statusDiv.style.color = 'red';
    });

    // 收到消息（实现实时显示）
    client.on('message', function (topic, message) {
        const msg = message.toString();
        console.log('收到消息:', msg);
        
        // 直接把收到的内容显示在屏幕上
        sensorValueDiv.innerText = msg; 
    });

    // 发送阈值（实现控制）
    function sendThreshold() {
        const val = document.getElementById('threshold').value;
        if (!val) {
            alert('请先输入阈值！');
            return;
        }

        if (client.connected) {
            // 向 ESP32 发送消息
            client.publish(MQTT_TOPIC, 'SET:' + val); 
            statusDiv.innerHTML = `📤 已发送阈值: ${val}`;
        } else {
            alert('MQTT 未连接，请稍等几秒再试！');
        }
    }
</script>

</body>
</html>
